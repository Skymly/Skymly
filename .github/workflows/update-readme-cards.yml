name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-readme-cards.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&show=reviews&rank_icon=percentile&theme=transparent&hide_border=true&hide_title=true&icon_color=7C3AED&ring_color=7C3AED&title_color=7C3AED&text_color=6B7280&text_bold=false&border_radius=0&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=6&card_width=320&theme=transparent&hide_border=true&hide_title=true&icon_color=7C3AED&title_color=7C3AED&text_color=6B7280&border_radius=0&size_weight=0.5&count_weight=0.5&exclude_repo=${{ github.event.repository.name }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Observables pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=${{ github.repository_owner }}&repo=Observables&theme=transparent&hide_border=true&icon_color=7C3AED&title_color=7C3AED&text_color=6B7280&border_radius=0
          path: profile/pin-observables.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate DesignPatterns pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=${{ github.repository_owner }}&repo=DesignPatterns&theme=transparent&hide_border=true&icon_color=7C3AED&title_color=7C3AED&text_color=6B7280&border_radius=0
          path: profile/pin-designpatterns.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "Update profile stats cards."
          git push
